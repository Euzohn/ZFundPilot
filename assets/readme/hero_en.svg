      <polygon points="50,6 56,38 50,50 44,38" fill="white" fill-opacity="0.42"/>
      <polygon points="94,50 62,56 50,50 62,44" fill="white" fill-opacity="0.42"/>
      <polygon points="50,94 44,62 50,50 56,62" fill="white" fill-opacity="0.34"/>
      <polygon points="6,50 38,44 50,50 38,56" fill="white" fill-opacity="0.34"/>
