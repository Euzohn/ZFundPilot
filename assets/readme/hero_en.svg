<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">ZFundPilot — Personal Fund Analysis &amp; Risk Management System</title>
  <desc id="desc">Dark terminal-style hero with Z compass logo and project name on the left, simulated portfolio overview panel on the right.</desc>

  <defs>
