    <linearGradient id="logo-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(59,130,246,0)"/>
      <stop offset="50%" stop-color="rgba(59,130,246,0.06)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
